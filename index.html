<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#302a66">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="なんこの大冒険">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <meta name="description" content="なんこ＆ちゃけがサラリーマンのはしもとに挑む、かわいいシューティングゲーム！">
  <title>なんこの大冒険！｜むかちゅくー！</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-sparkle">✦</span> なんこの大冒険！ <span class="brand-sparkle">✦</span></div>
      <div class="top-actions">
        <button id="pauseBtn" class="icon-btn" aria-label="一時停止" title="一時停止" disabled>⏸</button>
        <button id="soundBtn" class="icon-btn" aria-label="音をオン・オフ" title="音をオン・オフ">🔊</button>
      </div>
    </header>

    <section class="game-wrap" aria-label="ゲーム画面">
      <canvas id="game" width="390" height="660" aria-label="なんこの大冒険のゲーム画面"></canvas>
      <div id="screen" class="screen">
        <div class="screen-box">
          <div id="screenEyebrow" class="eyebrow">NANKO & CHAKE PRESENT</div>
          <div class="mascot-pair" aria-hidden="true"><span>👩🏻</span><span>🐥</span></div>
          <h1 id="screenTitle">なんこの<br>大冒険！</h1>
          <p id="screenText">お金・お肉・お魚を投げまくれ！<br>ラスボス「はしもと」をやっつけよう！</p>
          <button id="mainBtn" class="start-btn">🌸 ぼうけんスタート！</button>
          <div id="screenExtra" class="screen-extra">全３ステージ · ゆるかわシューティング</div>
        </div>
      </div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </section>

    <section class="controller" aria-label="ゲームの操作ボタン">
      <div class="control-header"><strong>なげるものをえらぼう！</strong><span id="weaponHint">💴 連射がとくい！</span></div>
      <div class="weapon-row">
        <button class="weapon active" data-weapon="money"><span class="weapon-icon">💴</span><span class="weapon-label">おかね</span><small>連射</small></button>
        <button class="weapon" data-weapon="meat"><span class="weapon-icon">🍖</span><span class="weapon-label">おにく</span><small>高威力</small></button>
        <button class="weapon" data-weapon="fish"><span class="weapon-icon">🐟</span><span class="weapon-label">おさかな</span><small>３方向</small></button>
      </div>
      <button id="specialBtn" class="special-btn" disabled><span class="special-symbol">😡</span><span id="specialLabel">むかちゅくーーー！！</span><span id="specialPercent">0%</span><span id="specialFill"></span></button>
      <p class="move-tip">📱 画面をなぞって移動・攻撃は自動 ／ 💻 矢印・WASD移動、1〜3武器変更、Zで必殺技</p>
    </section>
    <footer>なんこ × ちゃけ VS はしもと <span>♡</span> ぜんぶフィクションのコミカルバトル</footer>
  </main>
  <script src="game.js"></script>
  <script>
    // Service workers work on HTTPS and localhost; file:// still supports online gameplay.
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js", { scope: "./" }).catch(err => {
          console.warn("Offline installation unavailable:", err);
        });
      });
    }
  </script>
</body>
</html>
